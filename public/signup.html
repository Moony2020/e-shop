<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | E-Shop</title>
    <meta name="Author" content="Mymoon Dobaibi" />
    <meta name="Description" content="e-commerce" />
    <meta
      name="Keywords"
      content="e-commerce, clothes, electronic, sport, beauty"
    />
    <link rel="icon" href="img/favicon.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="stylesheet" type="text/css" href="css/auth.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/2f77fa652c.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <link
      rel="shortcut icon"
      href="./assets/images_readme/logo/logoWhite.png"
    />
    <!-- <link rel="stylesheet" href="./css/index.css" /> -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper@8/swiper-bundle.min.css"
    />
  </head>

  <body>
    <div class="auth-layout">
      <div class="auth-background">
        <div class="auth-overlay"></div>
        <div class="auth-content">
          <h1>Join Our Community</h1>
          <p>Discover the best products and exclusive deals</p>
        </div>
      </div>

      <div class="auth-form-container">
        <div class="auth-form-header">
          <a href="index.html" class="auth-logo"> <span>e.</span>Shop </a>
          <h2>Create Your Account</h2>
          <p>Already have an account? <a href="signin.html">Sign in</a></p>
        </div>

        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input
              class="input"
              type="text"
              id="signupName"
              placeholder="Your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input
              class="input"
              type="email"
              id="signupEmail"
              placeholder="your@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input
              class="input"
              type="password"
              id="signupPassword"
              placeholder="At least 6 characters"
              required
              minlength="6"
            />
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input
              class="input"
              type="password"
              id="signupConfirmPassword"
              placeholder="Confirm your password"
              required
              minlength="6"
            />
          </div>

          <button type="submit" class="auth-button primary">
            Create Account
          </button>

          <div class="auth-divider">
            <span>or sign up with</span>
          </div>

          <div class="social-auth">
            <button type="button" class="social-button google">
              <i class="ri-google-fill"></i> Google
            </button>
            <button type="button" class="social-button facebook">
              <i class="ri-facebook-fill"></i> Facebook
            </button>
          </div>
        </form>
        <div class="auth-footer">
          <p>
            By creating an account, you agree to our <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/confirmation.js"></script>
  </body>
</html>
