<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | E-Shop</title>
    <meta name="Author" content="Mymoon Dobaibi" />
    <meta name="Description" content="e-commerce" />
    <meta
      name="Keywords"
      content="e-commerce, clothes, electronic, sport, beauty"
    />
    <link rel="icon" href="img/favicon.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="stylesheet" type="text/css" href="css/auth.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/2f77fa652c.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <link
      rel="shortcut icon"
      href="./assets/images_readme/logo/logoWhite.png"
    />
    <!-- <link rel="stylesheet" href="./css/index.css" /> -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper@8/swiper-bundle.min.css"
    />
  </head>

  <body>
    <div class="auth-layout">
      <div class="auth-background">
        <div class="auth-overlay"></div>
        <div class="auth-content">
          <h1>Welcome Back</h1>
          <p>Sign in to access your personalized experience</p>
        </div>
      </div>

      <div class="auth-form-container">
        <div class="auth-form-header">
          <a href="index.html" class="auth-logo"> <span>e.</span>Shop </a>
          <h2>Sign In to Your Account</h2>
          <p>New to our shop? <a href="signup.html">Create an account</a></p>
        </div>

        <form id="signinForm" class="auth-form">
          <div class="form-group">
            <label for="signinEmail">Email Address</label>
            <div class="input-with-icon">
              <i class="ri-mail-line"></i>
              <input
                type="email"
                id="signinEmail"
                placeholder="your@email.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signinPassword">Password</label>
            <div class="input-with-icon">
              <i class="ri-lock-line"></i>
              <input
                type="password"
                id="signinPassword"
                placeholder="Enter your password"
                required
              />
            </div>
            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" /> Remember me
              </label>
              <a href="#forgot-password" class="forgot-password"
                >Forgot password?</a
              >
            </div>
          </div>

          <button type="submit" class="auth-button primary">
            <i class="ri-login-box-line"></i> Sign In
          </button>

          <div class="auth-divider">
            <span>or sign in with</span>
          </div>

          <div class="social-auth">
            <button type="button" class="social-button google">
              <i class="ri-google-fill"></i> Google
            </button>
            <button type="button" class="social-button facebook">
              <i class="ri-facebook-fill"></i> Facebook
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/confirmation.js"></script>
  </body>
</html>
